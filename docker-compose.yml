services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "8000:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracklah
      POSTGRES_PASSWORD: tracklah
      POSTGRES_DB: tracklah
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: ./services/api
    restart: unless-stopped
    depends_on:
      - postgres
      - rabbitmq
      - redis
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tracklah
      DB_PASSWORD: tracklah
      DB_NAME: tracklah
      RABBITMQ_URL: amqp://tracklah:tracklah@rabbitmq:5672
      REDIS_ADDR: redis:6379
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.tracklah.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  rabbitmq:
    image: rabbitmq:4.3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: tracklah
      RABBITMQ_DEFAULT_PASS: tracklah
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  location:
    build: ./services/location
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - redis
    environment:
      PORT: 8080
      RABBITMQ_URL: amqp://tracklah:tracklah@rabbitmq:5672
      REDIS_ADDR: redis:6379
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/firebase-adminsdk.json
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID}
    volumes:
      - ${FIRESTORE_CREDENTIALS_PATH}:/secrets/firebase-adminsdk.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.location.rule=Host(`location.tracklah.localhost`)"
      - "traefik.http.services.location.loadbalancer.server.port=8080"

  driver-simulator:
    build: ./services/driver-simulator
    restart: unless-stopped
    depends_on:
      - rabbitmq
    environment:
      DRIVER_ID: driver-99
      RABBITMQ_URL: amqp://tracklah:tracklah@rabbitmq:5672

  trip-events-consumer:
    build: ./services/trip-events-consumer
    restart: unless-stopped
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_URL: amqp://tracklah:tracklah@rabbitmq:5672

  jenkins:
    build: ./services/jenkins
    restart: unless-stopped
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.tracklah.localhost`)"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  jenkins-data:
