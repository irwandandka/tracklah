services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "8000:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracklah
      POSTGRES_PASSWORD: tracklah
      POSTGRES_DB: tracklah
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: ./services/api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tracklah
      DB_PASSWORD: tracklah
      DB_NAME: tracklah
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.tracklah.localhost`)"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  location:
    build: ./services/location
    restart: unless-stopped
    environment:
      PORT: 8080
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.location.rule=Host(`location.tracklah.localhost`)"
      - "traefik.http.services.location.loadbalancer.server.port=8080"

volumes:
  postgres-data:
